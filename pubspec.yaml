name: transcrify
description: "A new Flutter project."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  permission_handler: 13.0.2
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
